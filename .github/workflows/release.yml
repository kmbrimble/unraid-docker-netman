name: Release

# This repository is a READ-ONLY MIRROR of the primary repo on a private forge (Gitea). Never push here directly:
# the mirror force-syncs from the primary and would discard anything that exists only on GitHub.
#
# A release is a v* tag pushed to the primary and mirrored here. This workflow then rebuilds the package from
# the tagged source (the build is deterministic), requires the committed docker.netman.plg &md5; to equal the
# rebuilt md5, and publishes the GitHub Release with the .txz and .md5 attached. It does NOT commit, push or tag.
#
# workflow_dispatch is a dry run: it builds and prints the md5 and publishes nothing, so the build can be
# compared with the primary's CI without cutting a release.
#
# Installing the release on the Unraid host cannot run here (GitHub's runners cannot reach it): see
# scripts/install-on-host.sh and CLAUDE.md "Deploy and verify".

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      NAME: docker.netman
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Work out the version
        run: |
          set -euo pipefail
          PLG_VERSION=$(sed -rn 's|^<!ENTITY version[[:space:]]+"([^"]+)">.*|\1|p' docker.netman.plg)
          [ -n "$PLG_VERSION" ] || { echo "::error::could not read &version; from docker.netman.plg"; exit 1; }
          if [ "$DRY_RUN" = "true" ]; then
            VERSION="$PLG_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            [ "$VERSION" = "$PLG_VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME does not match docker.netman.plg &version; $PLG_VERSION"; exit 1; }
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # A release with no changelog entry is a release nobody can read.
      - name: Require a CHANGES entry for this version
        run: |
          set -euo pipefail
          grep -qx "###$VERSION" docker.netman.plg || {
            echo "::error::docker.netman.plg has no '###$VERSION' entry in <CHANGES>."
            exit 1
          }

      # Unraid compares plugin versions with strcmp, not semantically
      # (dynamix.plugin.manager/scripts/plugin: `strcmp($version, $installed_version) < 0`
      # -> "not installing older version"). So 1.0.10 sorts BEFORE 1.0.9. A release nobody can install is worse
      # than a failed one.
      - name: Version must sort after the previous tag the way Unraid compares it
        run: |
          set -euo pipefail
          PREV=$(git tag --list 'v*' | grep -vx "v$VERSION" | sort -V | tail -n1 | sed 's|^v||' || true)
          if [ -z "$PREV" ]; then
            echo "No previous tag - ordering check not applicable."
            exit 0
          fi
          python3 - "$PREV" "$VERSION" <<'PY'
          import sys
          prev, new = sys.argv[1], sys.argv[2]
          if not new > prev:
              sys.exit(
                  f"::error::Unraid compares plugin versions with strcmp, and {new!r} does not "
                  f"sort after the installed {prev!r}. Pick a version that sorts higher as a plain string "
                  f"(zero-pad rather than letting a component reach double digits)."
              )
          print(f"{new} sorts after {prev} - installable.")
          PY

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.4'
          extensions: simplexml

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22.23.4'

      # Same gate as the primary's CI, repeated deliberately: a release must stand on its own checks.
      - name: Lint
        run: find plugin tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check .plg parses
        run: php scripts/check-plg.php

      - name: UI tests, type-check, contrast and build
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run check:contrast
          npm run build

      - name: PHP tests
        run: php tests/run.php

      - name: JS tests
        run: |
          node tests/js.test.js
          node tests/globals.test.js

      - name: Dry run - report the md5 of this build
        if: env.DRY_RUN == 'true'
        run: bash scripts/check-md5.sh "$VERSION" --report-only

      - name: Rebuild and require the committed md5 to match
        if: env.DRY_RUN != 'true'
        run: bash scripts/check-md5.sh "$VERSION"

      - name: Publish the GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists - nothing to do."
            exit 0
          fi
          awk -v want="###$VERSION" '
            $0 == want { inside = 1; next }
            inside && /^###/ { exit }
            inside { print }
          ' docker.netman.plg > /tmp/notes.md
          gh release create "v$VERSION" \
            "dist/$NAME-$VERSION.txz" "dist/$NAME.md5" \
            --title "v$VERSION" --notes-file /tmp/notes.md

      - name: Summary
        if: env.DRY_RUN != 'true'
        run: |
          {
            echo "### Released v$VERSION"
            echo
            echo "- package: \`$NAME-$VERSION.txz\`"
            echo
            echo "Not yet installed on the Unraid host - run \`scripts/install-on-host.sh\` from the claude-code container."
          } >> "$GITHUB_STEP_SUMMARY"
